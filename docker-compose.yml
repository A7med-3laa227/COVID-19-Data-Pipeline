services:

  # ── PostgreSQL (used by both Airflow metadata and our covid_pipeline DB) ─────
  postgres:
    image: postgres:15-alpine
    container_name: covid_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "6112001"
      POSTGRES_MULTIPLE_DATABASES: "covid_pipeline,airflow"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./docker/init_multiple_db.sh:/docker-entrypoint-initdb.d/02_init_dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── pgAdmin ──────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ahmedalaa@gmail.com
      PGADMIN_DEFAULT_PASSWORD: "6112001"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Airflow common env (inherited by all airflow services) ───────────────────
  x-airflow-common: &airflow-common
    image: apache/airflow:2.9.3
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:6112001@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Pass covid DB credentials into DAG via env vars
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: covid_pipeline
      DB_USER: postgres
      DB_PASSWORD: "6112001"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/dags/pipeline
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy

  # ── Airflow Init (runs migrations + creates admin user) ──────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --role Admin \
          --username ahmed \
          --password 6112001 \
          --firstname ahmed \
          --lastname elmasny \
          --email ahmedalaa@gmail.com
    restart: "no"

  # ── Airflow Webserver ────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
  pgadmin_data:
